AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  VayuRahshak (Feature 6): fires, smoke paths and air quality for India, with alerts and cases for
  authorities and farmers. S3 + CloudFront serve the web app and forward API calls; API Gateway HTTP API +
  one Lambda (Python 3.12) do the work; DynamoDB keeps alerts and cases; S3 also keeps a shared copy of the
  slow results; EventBridge refreshes it every 30 minutes. Amazon Cognito sign-in and SNS email are optional
  and OFF by default. Deploy with scripts/deploy_aws.sh (see README, "Deploy to AWS").

Parameters:
  FirmsMapKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Free NASA FIRMS MAP_KEY (https://firms.modaps.eosdis.nasa.gov/api/map_key/). Leave empty to skip fires.
  OpenAqApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Free OpenAQ v3 API key (https://explore.openaq.org/register). Leave empty and the measured air tab has no stations.
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Google Gemini API key for the farmer's AI crop doctor and crop advice. Leave empty to switch the AI off (the symptom guide still works).
  WindLevel:
    Type: String
    Default: 120m
    AllowedValues: [10m, 80m, 120m, 180m]
    Description: Forecast wind height used for the smoke path.
  OverpassUrl:
    Type: String
    Default: https://overpass-api.de/api/interpreter
    Description: Overpass API endpoint for places. Change only if the main server is down.
  EnableAuth:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      "true" creates an Amazon Cognito user pool (groups citizen, farmer and authority) and makes POST /alerts, GET /activity,
      GET /cases and PATCH /cases/{id} require a signed-in authority. "false" (default) leaves those routes OPEN:
      anyone with the URL could send alerts. Use "false" only for a private demo.
  CognitoDomainPrefix:
    Type: String
    Default: ""
    Description: >-
      Only with EnableAuth=true. A globally unique word for the sign-in page address
      (<prefix>.auth.<region>.amazoncognito.com), for example vayurahshak-yourname.
  AppUrl:
    Type: String
    Default: http://localhost:8000/index.html
    Description: >-
      Only with EnableAuth=true. Where the web app is served (Cognito sends people back here after sign-in).
      It must be https, except for localhost. Add your CloudFront or S3 address when you host the app.
  EnableEmail:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      "true" also emails every alert through Amazon SNS (to AlertsEmail). SMS is not used: sending SMS in India needs
      DLT registration. The in-app inbox is always the main channel.
  AlertsEmail:
    Type: String
    Default: ""
    Description: Only with EnableEmail=true. An address that receives a copy of every alert (it must confirm the SNS subscription).

Rules:
  AuthNeedsADomain:
    RuleCondition: !Equals [!Ref EnableAuth, "true"]
    Assertions:
      - Assert: !Not [!Equals [!Ref CognitoDomainPrefix, ""]]
        AssertDescription: Set CognitoDomainPrefix (a unique word) when EnableAuth is true.

Conditions:
  UseAuth: !Equals [!Ref EnableAuth, "true"]
  NoAuth: !Equals [!Ref EnableAuth, "false"]
  UseEmail: !Equals [!Ref EnableEmail, "true"]
  HasAlertsEmail: !And
    - !Equals [!Ref EnableEmail, "true"]
    - !Not [!Equals [!Ref AlertsEmail, ""]]

Resources:
  SmokeApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: VayuRahshak API
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization
        MaxAge: 600
      DefaultRouteSettings:
        # Protects the free upstream APIs (and your FIRMS key quota) from floods.
        ThrottlingBurstLimit: 100
        ThrottlingRateLimit: 40
      RouteSettings:
        # Each call here is a paid-quota call to Gemini, so these are kept low.
        "POST /farmer/diagnose":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        "POST /farmer/crop-advice":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        "POST /farmer/chat":
          ThrottlingBurstLimit: 10
          ThrottlingRateLimit: 3
        "POST /farmer/stubble-plan":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1
        "POST /farmer/brief":
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1

  # ---- the web app: a private S3 bucket behind CloudFront (which also forwards the API paths to API Gateway) ------
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-site"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: VayuRahshak web app and API
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_200
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccess.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${SmokeApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
        CacheBehaviors:
          - PathPattern: /fires
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad   # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac   # Managed-AllViewerExceptHostHeader
          - PathPattern: /stations
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /forecast
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /air
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /smoke
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /alerts
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /alerts/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /farmer/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /activity
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /cases
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /cases/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  # ---- a shared copy of the slow results (fires, wind grid, air forecast): every Lambda copy reads it ----------------
  CacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-copies
            Status: Enabled
            ExpirationInDays: 3

  # ---- storage: alerts and cases (on-demand billing, nothing to size) ---------------------------------------
  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  # ---- optional: email copy of alerts ---------------------------------------------------------------------------
  AlertsTopic:
    Type: AWS::SNS::Topic
    Condition: UseEmail
    Properties:
      DisplayName: VayuRahshak alerts

  AlertsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertsEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertsEmail

  # ---- optional: sign-in with Amazon Cognito -----------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: UseAuth
    Properties:
      UserPoolName: vayurahshak
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: UseAuth
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: vayurahshak-web
      GenerateSecret: false
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - implicit
      AllowedOAuthScopes:
        - openid
        - email
      CallbackURLs:
        - !Ref AppUrl
      LogoutURLs:
        - !Ref AppUrl

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: UseAuth
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix

  CitizenGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: UseAuth
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: citizen
      Description: People who read alerts

  FarmerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: UseAuth
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: farmer
      Description: Farmers who read warnings about fires near their farm and acknowledge them

  AuthorityGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: UseAuth
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: authority
      Description: Officers who may warn sources, send alerts and manage cases

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: UseAuth
    Properties:
      ApiId: !Ref SmokeApi
      AuthorizerType: JWT
      Name: cognito
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Audience:
          - !Ref UserPoolClient
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}

  # ---- the function ---------------------------------------------------------------------------------------------------
  SmokePathFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: "VayuRahshak: fires, smoke paths, air quality, alerts and cases"
      CodeUri: src/
      Handler: smoke_path.app.lambda_handler
      Runtime: python3.12
      Architectures:
        - arm64
      # API Gateway cuts a web request at 29 s; the scheduled refresh below may take longer, so the function may run to 120 s.
      Timeout: 120
      MemorySize: 512
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AlertsTable
        - S3CrudPolicy:
            BucketName: !Ref CacheBucket
        - !If
          - UseEmail
          - SNSPublishMessagePolicy:
              TopicName: !GetAtt AlertsTopic.TopicName
          - !Ref AWS::NoValue
      Environment:
        Variables:
          # API key consumed by smoke_path/fires.py (NASA FIRMS). Comes from the NoEcho parameter.
          FIRMS_MAP_KEY: !Ref FirmsMapKey
          # API key consumed by smoke_path/stations.py (OpenAQ, fallback for live air). From the NoEcho parameter.
          OPENAQ_API_KEY: !Ref OpenAqApiKey
          # API key consumed by smoke_path/gemini.py (Google Gemini, farmer's AI advice). From the NoEcho parameter.
          GEMINI_API_KEY: !Ref GeminiApiKey
          WIND_LEVEL: !Ref WindLevel
          OVERPASS_URL: !Ref OverpassUrl
          ALERTS_TABLE: !Ref AlertsTable
          CACHE_BUCKET: !Ref CacheBucket
          # "true": the code checks that the caller is in the Cognito group "authority" (API Gateway has verified the token).
          REQUIRE_AUTHORITY: !If [UseAuth, "true", "false"]
          ALERTS_SNS_TOPIC: !If [UseEmail, !Ref AlertsTopic, ""]
      Events:
        # Every 30 minutes: fetch fires, stations and the air forecast again and save them to S3, so no visitor waits.
        WarmCache:
          Type: Schedule
          Properties:
            Schedule: rate(30 minutes)
            Input: '{"warm": true}'
        PostFarmerDiagnose:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmokeApi
            Path: /farmer/diagnose
            Method: POST
        PostFarmerChat:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmokeApi
            Path: /farmer/chat
            Method: POST
        PostFarmerStubblePlan:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmokeApi
            Path: /farmer/stubble-plan
            Method: POST
        PostFarmerBrief:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmokeApi
            Path: /farmer/brief
            Method: POST
        PostFarmerCropAdvice:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmokeApi
            Path: /farmer/crop-advice
            Method: POST
        GetSmoke:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmokeApi
            Path: /smoke
            Method: GET
        GetFires:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmokeApi
            Path: /fires
            Method: GET
        GetStations:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmokeApi
            Path: /stations
            Method: GET
        GetForecast:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmokeApi
            Path: /forecast
            Method: GET
        GetAir:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmokeApi
            Path: /air
            Method: GET
        # The citizen inbox: public by design (it only returns public alerts for an area).
        GetAlerts:
          Type: HttpApi
          Properties:
            ApiId: !Ref SmokeApi
            Path: /alerts
            Method: GET

  # ---- authority routes: written out by hand so they can be open (EnableAuth=false) or JWT-protected (true) ---------
  AuthorityIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SmokeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SmokePathFunction.Arn
      PayloadFormatVersion: "2.0"

  AuthorityInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SmokePathFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SmokeApi}/*/*/*

  PostAlertsOpen:
    Type: AWS::ApiGatewayV2::Route
    Condition: NoAuth
    Properties:
      ApiId: !Ref SmokeApi
      RouteKey: POST /alerts
      Target: !Sub integrations/${AuthorityIntegration}
  PostAlertsAuth:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseAuth
    Properties:
      ApiId: !Ref SmokeApi
      RouteKey: POST /alerts
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${AuthorityIntegration}

  AckAlertOpen:
    Type: AWS::ApiGatewayV2::Route
    Condition: NoAuth
    Properties:
      ApiId: !Ref SmokeApi
      RouteKey: POST /alerts/{alert_id}/ack
      Target: !Sub integrations/${AuthorityIntegration}
  AckAlertAuth:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseAuth
    Properties:
      ApiId: !Ref SmokeApi
      RouteKey: POST /alerts/{alert_id}/ack
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${AuthorityIntegration}

  GetActivityOpen:
    Type: AWS::ApiGatewayV2::Route
    Condition: NoAuth
    Properties:
      ApiId: !Ref SmokeApi
      RouteKey: GET /activity
      Target: !Sub integrations/${AuthorityIntegration}
  GetActivityAuth:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseAuth
    Properties:
      ApiId: !Ref SmokeApi
      RouteKey: GET /activity
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${AuthorityIntegration}

  GetCasesOpen:
    Type: AWS::ApiGatewayV2::Route
    Condition: NoAuth
    Properties:
      ApiId: !Ref SmokeApi
      RouteKey: GET /cases
      Target: !Sub integrations/${AuthorityIntegration}
  GetCasesAuth:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseAuth
    Properties:
      ApiId: !Ref SmokeApi
      RouteKey: GET /cases
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${AuthorityIntegration}

  PatchCaseOpen:
    Type: AWS::ApiGatewayV2::Route
    Condition: NoAuth
    Properties:
      ApiId: !Ref SmokeApi
      RouteKey: PATCH /cases/{fire_id}
      Target: !Sub integrations/${AuthorityIntegration}
  PatchCaseAuth:
    Type: AWS::ApiGatewayV2::Route
    Condition: UseAuth
    Properties:
      ApiId: !Ref SmokeApi
      RouteKey: PATCH /cases/{fire_id}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      Target: !Sub integrations/${AuthorityIntegration}

Outputs:
  SiteUrl:
    Description: The web app. Open this address.
    Value: !Sub "https://${SiteDistribution.DomainName}"
  SiteBucketName:
    Description: S3 bucket holding the web app files (scripts/deploy_aws.sh uploads to it)
    Value: !Ref SiteBucket
  DistributionId:
    Description: CloudFront distribution (scripts/deploy_aws.sh clears its cache after an upload)
    Value: !Ref SiteDistribution
  ApiBaseUrl:
    Description: The API address. Open the web app with index.html?api=<this URL> (no trailing slash).
    Value: !Sub "https://${SmokeApi}.execute-api.${AWS::Region}.amazonaws.com"
  SmokeApiUrl:
    Description: The smoke path endpoint
    Value: !Sub "https://${SmokeApi}.execute-api.${AWS::Region}.amazonaws.com/smoke"
  SampleUrl:
    Description: Saved demo response (no external calls)
    Value: !Sub "https://${SmokeApi}.execute-api.${AWS::Region}.amazonaws.com/smoke?sample=true"
  FunctionName:
    Description: Lambda function name (for logs in CloudWatch)
    Value: !Ref SmokePathFunction
  AlertsTableName:
    Description: DynamoDB table holding alerts and cases
    Value: !Ref AlertsTable
  UserPoolId:
    Condition: UseAuth
    Description: Cognito user pool. Add people to the groups citizen and authority (see README).
    Value: !Ref UserPool
  UserPoolClientId:
    Condition: UseAuth
    Description: Put this in the cognito block of frontend/index.html (clientId).
    Value: !Ref UserPoolClient
  CognitoDomain:
    Condition: UseAuth
    Description: Put this in the cognito block of frontend/index.html (domain).
    Value: !Sub "${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  AlertsTopicArn:
    Condition: UseEmail
    Description: SNS topic that emails a copy of every alert
    Value: !Ref AlertsTopic
